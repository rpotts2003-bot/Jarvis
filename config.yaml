assistant_name: Jarvis
wake_name: Jarvis
always_listen: true
silence_timeout_ms: 5000
stt_hang_timeout_ms: 10000
min_utterance_ms: 300
barge_in_threshold: 0.35

allowlist:
  apps:
    - notepad
    - calculator
    - calc
    - chrome
    - firefox
    - code
  url_domains: []  # empty = first-use confirm for any https host
  folder_roots:
    - ~/Documents
    - ~/Downloads

permissions:
  open_url_confirm_unknown_domain: true
  type_text_confirm_long: true
  type_text_long_chars: 200

plex:
  # Folder Plex watches for Movies (create this on your laptop)
  library_dir: ~/PlexMedia/Movies
  # Optional later: Plex token for auto-scan via local API
  # token: ""
  # base_url: http://127.0.0.1:32400

# Free TTS — neural UK male online (Edge); SAPI George offline fallback
voice:
  rate: 175              # SAPI/pyttsx3 fallback (~200 default; was 145)
  volume: 0.92
  voice_hint: George     # prefer Microsoft George / en-GB male when offline
  edge_voice: en-GB-RyanNeural
  edge_rate: "+8%"       # slightly brisk Jarvis manner (not draggy)
