[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "desktop-jarvis"
version = "0.1.0"
description = "Jarvis-like desktop assistant MVP (voice, memory, allowlisted PC actions)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
jarvis = "assistant.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["assistant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
